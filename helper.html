<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat helper – Lumora</title>
<meta name="robots" content="noindex">
<meta name="description" content="Pick a voice and get a reply you can send.">
<link rel="canonical" href="https://lumoral.netlify.app/helper"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
#gateScreen{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
#gateScreen .card{max-width:320px;padding:30px 26px}
body{padding-bottom:0 !important}
.hc{max-width:720px;margin:0 auto;display:flex;flex-direction:column;height:calc(100dvh - 152px - env(safe-area-inset-bottom))}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 16px 10px}
.vbar h1{font-size:1.2rem;margin:0}
.vr{display:flex;gap:8px;align-items:center}
.vchip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--bg-2) !important;border:1px solid var(--line) !important;color:var(--ink);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--bg-2) !important;border:1px solid var(--line) !important;color:var(--ink);cursor:pointer;padding:0}
.av{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;width:28px;height:28px;font-size:.62rem;letter-spacing:.02em}
.av.lg{width:64px;height:64px;font-size:1.1rem}
.log{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.5;font-size:.95rem;overflow-wrap:anywhere;animation:pop .18s ease-out}
.m p{margin:0}.m p+p,.m p+.rc,.rc+p{margin-top:8px}
.m.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.m.ai{align-self:flex-start;background:var(--bg-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.err{border-color:#e11d48;color:#e11d48}
.rc{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 10px 10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);margin-top:8px}
.rc span{flex:1;white-space:pre-wrap}
.cp{flex:none;display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:.78rem;cursor:pointer;padding:2px 4px}
.note{align-self:center;color:var(--dim);font-size:.78rem;padding:2px 10px}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bl 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.empty{margin:auto;text-align:center;padding:10px 12px;max-width:340px}
.empty h2{font-size:1.25rem;margin:14px 0 4px}.empty p{color:var(--dim);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{padding:9px 14px;border-radius:99px;background:var(--bg-2) !important;border:1px solid var(--line) !important;color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.comp{display:flex;gap:8px;align-items:flex-end;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--bg)}
.comp textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:22px !important;padding:11px 16px !important;line-height:1.4;margin:0}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.send:disabled{opacity:.4;cursor:default}
#vsheet{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
#vsheet .box{width:100%;max-width:520px;max-height:82dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
#vsheet h3{margin:2px 6px 12px;font-size:1.05rem}
.vo{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 10px;border-radius:14px;background:none;border:1px solid transparent;color:var(--ink);font:inherit;cursor:pointer}
.vo.on{background:var(--bg-2);border-color:var(--accent)}
.vo .av{width:42px;height:42px;font-size:.8rem}
.vo b{display:block}.vo small{color:var(--dim);display:block;font-size:.8rem;line-height:1.35}
@media(prefers-reduced-motion:reduce){.m,.typing i{animation:none}}
</style>
</head><body>
<div id="gateScreen" hidden><div class="glass card">
  <p style="font-weight:800;font-size:1.15rem;margin-bottom:8px">Sign in to use Chat helper</p>
  <p class="sub" style="margin-bottom:20px">Create a free Lumora account. It only takes a moment.</p>
  <a class="btn pri" id="gateLink" href="/login?next=/helper">Sign in or create account</a>
</div></div>
<div id="gatedApp" hidden><div class="hc">
  <div class="vbar">
    <h1>Chat helper</h1>
    <div class="vr">
      <button class="vchip" id="vchip" type="button" aria-label="Change voice"></button>
      <button class="ib" id="newchat" type="button" aria-label="New chat"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div class="log" id="log" role="log" aria-live="polite"></div>
  <form class="comp" id="comp" autocomplete="off">
    <textarea id="inp" rows="1" maxlength="2000" placeholder="Paste a message or ask anything..." aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div></div>
<script type="module">
import {requireAuth} from '/gate.js';
import {mountNav} from '/nav.js';
import {auth} from '/firebase-init.js';
mountNav();requireAuth();

const P=[
 {s:'confident',n:'Confident',i:'C',c:'#0f766e',d:'Calm and self-assured, never desperate.'},
 {s:'charming',n:'Charming',i:'C',c:'#d61f69',d:'Warm, smooth and a little flirty.'},
 {s:'funny',n:'Funny',i:'F',c:'#f59e0b',d:'Playful replies and jokes that keep the chat light.'},
 {s:'romantic',n:'Romantic',i:'R',c:'#e11d48',d:'Sweet and heartfelt.'},
 {s:'nonchalant',n:'Nonchalant',i:'N',c:'#6b6f7a',d:"Cool, short replies that don't try too hard."},
 {s:'straight',n:'Straight Talker',i:'ST',c:'#334155',d:'Clear and honest, no games.'},
 {s:'observer',n:'The Observer',i:'O',c:'#2b3cff',d:"Spots what doesn't add up and tells you what to ask."},
 {s:'peacemaker',n:'Peacemaker',i:'P',c:'#059669',d:'Calms arguments and helps you say sorry the right way.'},
 {s:'boundary',n:'Boundary Setter',i:'BS',c:'#7c3aed',d:'Politely says no and stands firm without a fight.'},
 {s:'confrontation',n:'The Confrontation Coach',i:'CC',c:'#b91c1c',d:'A roleplay partner who deflects, so you can practise a hard talk.'},
];
const $=s=>document.querySelector(s), log=$('#log'), inp=$('#inp'), sendBtn=$('#send');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av=(p,cls='')=>`<span class="av ${cls}" style="background:${p.c}" aria-hidden="true">${p.i}</span>`;
const COPY='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>';
let voice=P.find(p=>p.s===ls.get('lumora_voice'))||P[0], msgs=[], busy=false;
try{msgs=JSON.parse(ls.get('lumora_helper_chat')||'[]').filter(m=>m&&m.content)}catch(e){}
const save=()=>ls.set('lumora_helper_chat',JSON.stringify(msgs.slice(-40)));

function ai(text){ // "> " lines become ready-to-send reply cards with a copy button
  let html='',para=[];
  const flush=()=>{if(para.length){html+='<p>'+esc(para.join('\n')).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>';para=[]}};
  for(const line of text.split('\n')){
    const m=line.match(/^\s*>\s?(.*)$/);
    if(m&&m[1].trim()){flush();html+=`<div class="rc"><span>${esc(m[1].trim().replace(/^["“]|["”]$/g,''))}</span><button type="button" class="cp" aria-label="Copy reply">${COPY}Copy</button></div>`}
    else if(line.trim()) para.push(line.trim()); else flush();
  }
  flush();return html;
}
function bubble(m){
  const d=document.createElement('div');
  if(m.role==='user'){d.className='m me';d.textContent=m.content}
  else{d.className='m ai';d.innerHTML=ai(m.content)}
  return d;
}
function scroll(){log.scrollTop=log.scrollHeight}
function chip(){$('#vchip').innerHTML=av(voice)+'<span>'+esc(voice.n.replace('The ',''))+'</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'}
function render(){
  log.innerHTML='';
  if(!msgs.length){
    log.innerHTML=`<div class="empty">${av(voice,'lg')}<h2>Hi, I'm your ${esc(voice.n.replace('The ',''))} helper</h2><p>${esc(voice.d)} Paste a message you got, or tell me what's going on.</p>
    <div class="chips"><button>Help me reply to a message</button><button>How do I say sorry?</button><button>Say no without a fight</button><button>Practise a hard talk</button></div></div>`;
    log.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;grow();ask()});
  }else msgs.forEach(m=>log.append(bubble(m)));
  scroll();
}
log.addEventListener('click',async e=>{
  const b=e.target.closest('.cp');if(!b)return;
  try{await navigator.clipboard.writeText(b.previousElementSibling.textContent);const o=b.innerHTML;b.textContent='Copied';setTimeout(()=>b.innerHTML=o,1400)}catch(x){}
});
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';sendBtn.disabled=busy||!inp.value.trim()}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();ask()}});
$('#comp').addEventListener('submit',e=>{e.preventDefault();ask()});

async function ask(){
  const text=inp.value.trim();if(!text||busy)return;
  busy=true;inp.value='';grow();
  if(!msgs.length)log.innerHTML='';
  const um={role:'user',content:text};msgs.push(um);log.append(bubble(um));
  const t=document.createElement('div');t.className='m ai typing';t.innerHTML='<i></i><i></i><i></i>';log.append(t);scroll();
  try{
    const res=await fetch('/.netlify/functions/chat-helper-reply',{method:'POST',
      headers:{'content-type':'application/json',Authorization:'Bearer '+await auth.currentUser.getIdToken()},
      body:JSON.stringify({persona:voice.s,messages:msgs.slice(-20)})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||'Something went wrong. Please try again.');
    const am={role:'assistant',content:data.reply};msgs.push(am);t.replaceWith(bubble(am));save();
  }catch(e){
    msgs.pop();inp.value=text;
    const d=document.createElement('div');d.className='m ai err';d.textContent=e.message;t.replaceWith(d);
  }
  busy=false;grow();scroll();inp.focus({preventScroll:true});
}

function sheet(){
  const el=document.createElement('div');el.id='vsheet';
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="Choose a voice"><h3>Choose a voice</h3>`+
    P.map(p=>`<button class="vo${p.s===voice.s?' on':''}" data-s="${p.s}">${av(p)}<span><b>${esc(p.n)}</b><small>${esc(p.d)}</small></span></button>`).join('')+`</div>`;
  document.body.append(el);
  const close=()=>el.remove();
  el.onclick=e=>{if(e.target===el)close()};
  el.querySelectorAll('.vo').forEach(b=>b.onclick=()=>{
    const p=P.find(x=>x.s===b.dataset.s);close();if(p.s===voice.s)return;
    voice=p;ls.set('lumora_voice',p.s);chip();
    if(msgs.length){const n=document.createElement('div');n.className='note';n.textContent='Voice changed to '+p.n;log.append(n);scroll()}else render();
  });
}
$('#vchip').onclick=sheet;
$('#newchat').onclick=()=>{if(busy)return;msgs=[];save();render();inp.focus()};
chip();render();grow();
</script>
</body></html>
