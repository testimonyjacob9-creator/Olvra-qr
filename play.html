@media(prefers-reduced-motion:reduce){.bc.vex{animation:none}}
</style>

const MOODS={easy:{label:'Go easy',dElo:-250},fair:{label:'Fair fight',dElo:0},brutal:{label:'No mercy',dElo:250}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const GL={1:'\u265F',2:'\u265E',3:'\u265D',4:'\u265C',5:'\u265B',6:'\u265A'};
const glyph=t=>GL[t]+'\uFE0E';

/* records */
const REC_KEY='lumora_chess_rec';
const rec=()=>{try{return JSON.parse(localStorage.getItem(REC_KEY))||{}}catch(e){return {}}};
const saveRec=(id,k)=>{try{const r=rec();r[id]=r[id]||{w:0,l:0,d:0};r[id][k]++;localStorage.setItem(REC_KEY,JSON.stringify(r))}catch(e){}};
const recText=id=>{const r=rec()[id];return r?`${r.w}W \u00b7 ${r.l}L \u00b7 ${r.d}D`:'Not played yet'};

/* ---------------- Lobby ---------------- */
function themeVars(node,b){node.style.setProperty('--c1',b.c1);node.style.setProperty('--c2',b.c2)}
function avatar(b,cls){
  const a=el('div',cls||'bav');themeVars(a,b);
  const fallback=()=>{a.textContent=b.emoji};
  if(b.id!=='vex'){const i=new Image();i.alt='';i.decoding='async';i.src=`/.netlify/functions/persona-image?id=${b.id}&v=1`;i.onload=()=>{a.textContent='';a.appendChild(i)};fallback()}else fallback();
  return a;
}
function renderLobby(){
  const box=$('#bots');box.textContent='';
  BOTS.forEach(b=>{
    const c=el('button','bc'+(b.evil?' vex':''));c.type='button';themeVars(c,b);
    const body=el('div','bb'),nm=el('div','bn',b.name);nm.appendChild(el('span','tag'+(b.evil?' evil':''),b.tag));
    const pips=el('div','pips');for(let i=1;i<=5;i++){const p=el('i',i<=Math.ceil(b.level)?'on':'');pips.appendChild(p)}
    const meta=el('div','bm');meta.append(pips,el('span','',`~${b.elo}`),el('span','',recText(b.id)));
    body.append(nm,el('div','bt',b.title),el('div','bq','\u201C'+b.intro+'\u201D'),meta);
    c.append(avatar(b),body);c.onclick=()=>openSetup(b);box.appendChild(c);
  });
}

/* setup sheet */
let SET={color:'w',mood:'fair'};
function openSetup(b){
  SET={color:'r',mood:b.level<=1?'fair':'fair'};
  const box=$('#sbox');box.textContent='';themeVars(box,b);
  const av=avatar(b);const h=el('h3','',b.name);const t=el('div','bt',b.title+' \u00b7 ~'+b.elo);const q=el('div','bq','\u201C'+b.intro+'\u201D');
  box.append(av,h,t,q);
  const seg=(label,key,opts)=>{
    box.appendChild(el('div','opt',label));const g=el('div','seg3');
    opts.forEach(([v,txt])=>{const x=el('button','',txt);x.type='button';x.setAttribute('aria-pressed',String(SET[key]===v));
      x.onclick=()=>{SET[key]=v;[...g.children].forEach(y=>y.setAttribute('aria-pressed','false'));x.setAttribute('aria-pressed','true')};g.appendChild(x)});
    box.appendChild(g);
  };
  seg('Play as','color',[['w','White'],['r','Random'],['b','Black']]);
  seg('Difficulty','mood',[['easy','Go easy'],['fair','Fair fight'],['brutal','No mercy']]);
  const go=el('button','go','Start game');go.type='button';go.onclick=()=>{closeSetup();startGame(b,SET.mood,SET.color)};
  const cn=el('button','cancel','Not now');cn.type='button';cn.onclick=closeSetup;
  box.append(go,cn);$('#sheet').hidden=false;
}
function closeSetup(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSetup()});

/* ---------------- Game ---------------- */
let G=null,worker=null,reqId=0,sayTimer=null,resignTimer=null;
function getWorker(){if(worker)return worker;try{worker=new Worker('/chess-engine.js');worker.onerror=()=>{worker=null}}catch(e){worker=null}return worker}
function botParams(b,mood){
  let d=b.depth,m=b.margin,bl=b.blunder,ms=b.ms;
  if(mood==='easy'){d=Math.max(1,d-1);m+=120;bl+=.1;ms*=.6}
  else if(mood==='brutal'){d+=1;m=Math.floor(m/3);bl=0;ms*=1.4}
  return {depth:d,margin:m,blunder:bl,ms:Math.round(ms)};
}
function startGame(b,mood,colorChoice){
  const my=colorChoice==='w'?1:colorChoice==='b'?-1:(Math.random()<.5?1:-1);
  G={bot:b,mood,my,pos:new Pos().load(START),hist:[],keys:{},caps:{1:[],'-1':[]},last:null,sel:null,dests:[],over:false,busy:false,anim:null,prev:null,flip:my===-1,idleN:0};
  G.keys[G.pos.key()]=1;
  const arena=$('#game');themeVars(arena,b);arena.style.setProperty('--glow',b.c2+'44');arena.style.setProperty('--glow2',b.c1+'66');
  arena.style.setProperty('--l',b.board[0]);arena.style.setProperty('--d',b.board[1]);
  $('#board').style.setProperty('--l',b.board[0]);$('#board').style.setProperty('--d',b.board[1]);
  const tn=$('#topav');tn.replaceWith(Object.assign(avatar(b,'bav'),{id:'topav'}));
  $('#topnm').innerHTML='';$('#topnm').append(document.createTextNode(b.name),Object.assign(el('small','',`${b.title} \u00b7 ~${b.elo+MOODS[mood].dElo}`)));
  $('#mesub').textContent=my===1?'White':'Black';
  $('#gtitle').textContent=`Chess \u00b7 ${MOODS[mood].label}`;
  $('#lobby').hidden=true;$('#game').hidden=false;$('#res').hidden=true;document.body.classList.add('ingame');window.scrollTo(0,0);
  $('#resign').textContent='Resign';$('#resign').disabled=false;
  render();say('start',500);
  if(G.pos.side!==G.my)setTimeout(botMove,1400);
}
function leave(){
  reqId++;G=null;clearTimeout(sayTimer);$('#game').hidden=true;$('#res').hidden=true;$('#lobby').hidden=false;document.body.classList.remove('ingame');renderLobby();
}
$('#gback').onclick=()=>{if(!G||G.over||G.hist.length<2){leave();return}if($('#gback').dataset.arm){leave();return}$('#gback').dataset.arm='1';$('#bub').textContent='Tap back again to leave. This game will count as unfinished.';setTimeout(()=>delete $('#gback').dataset.arm,3000)};
$('#gflip').onclick=()=>{if(G){G.flip=!G.flip;render()}};
$('#rematch').onclick=()=>{if(!G)return;if(!G.over&&G.hist.length>1&&!$('#rematch').dataset.arm){$('#rematch').dataset.arm='1';$('#rematch').textContent='Tap again to restart';setTimeout(()=>{delete $('#rematch').dataset.arm;$('#rematch').textContent='New game'},3000);return}
  delete $('#rematch').dataset.arm;$('#rematch').textContent='New game';reqId++;startGame(G.bot,G.mood,G.over?(G.my===1?'b':'w'):(G.my===1?'w':'b'))};
$('#resign').onclick=()=>{if(!G||G.over)return;const r=$('#resign');if(!resignTimer){r.textContent='Tap again to resign';resignTimer=setTimeout(()=>{resignTimer=null;r.textContent='Resign'},3000);return}clearTimeout(resignTimer);resignTimer=null;r.textContent='Resign';finish('resign')};

/* speech */
function say(ev,delay){
  if(!G)return;const b=G.bot,lines=(b.say[ev]||b.say.idle);if(!lines)return;
  const bub=$('#bub');clearTimeout(sayTimer);bub.className='bub dots';bub.innerHTML='<i></i><i></i><i></i>';
  const g=G;sayTimer=setTimeout(()=>{if(G!==g)return;bub.className='bub';bub.textContent=pick(lines)},(delay||0)+500+Math.random()*500);
}
function sayNow(text){const bub=$('#bub');bub.className='bub';bub.textContent=text}

/* rendering */
const sqEls=[];
function render(){
  const board=$('#board'),flip=G.flip;board.textContent='';sqEls.length=0;
  const checkSq=G.pos.inCheck(G.pos.side)?(G.pos.side===1?G.pos.kw:G.pos.kb):-1;
  for(let i=0;i<64;i++){
    const s=flip?63-i:i,r=s>>3,c=s&7,v=G.pos.b[s];
    const q=el('button','sq'+((r+c)%2?' d':''));q.type='button';q.dataset.s=s;
    if(G.last&&(s===G.last.f||s===G.last.t))q.classList.add('last');
    if(G.sel===s)q.classList.add('sel');
    if(s===checkSq)q.classList.add('chk');
    const d=G.dests.find(x=>x.t===s);if(d)q.classList.add(v||d.ep?'cp':'dot');
    if(v){const p=el('span','pc '+(v>0?'w':'b'),glyph(Math.abs(v)));q.appendChild(p)}
    if(i%8===0)q.appendChild(el('span','co r',String(8-r)));
    if(i>=56)q.appendChild(el('span','co f','abcdefgh'[c]));
    q.setAttribute('aria-label',sqName(s)+(v?' '+(v>0?'white ':'black ')+['','pawn','knight','bishop','rook','queen','king'][Math.abs(v)]:''));
    q.onclick=()=>onSquare(s);board.appendChild(q);sqEls[s]=q;
  }
  if(G.anim){const a=G.anim;G.anim=null;const dst=sqEls[a.t],src=sqEls[a.f],pe=dst&&dst.querySelector('.pc');
    if(pe&&src){const r1=src.getBoundingClientRect(),r2=dst.getBoundingClientRect();pe.classList.add('mv');pe.style.transition='none';pe.style.transform=`translate(${r1.left-r2.left}px,${r1.top-r2.top}px)`;pe.getBoundingClientRect();pe.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';pe.style.transform='none'}}
  // captured + material
  const adv=mat(G.my===1?1:-1);
  const showCap=(node,color,plus)=>{node.textContent='';G.caps[color].slice().sort((a,b)=>b-a).forEach(t=>{const s=el('span','',glyph(t));node.appendChild(s)});if(plus>0)node.appendChild(el('em','','+'+plus))};
  showCap($('#mecap'),-G.my,adv); // pieces I captured are the opponent's color
  showCap($('#topcap'),G.my,-adv);
  // moves
  const mv=$('#moves');mv.textContent='';
  G.hist.forEach((h,i)=>{const sp=el('span',i===G.hist.length-1?'cur':'');if(i%2===0)sp.appendChild(el('b','',Math.floor(i/2)+1+'.'));sp.appendChild(document.createTextNode(h.san));mv.appendChild(sp)});
  mv.scrollLeft=mv.scrollWidth;
}
function mat(side){ // material lead for `side`, from captured lists (captured[color] = pieces of that color that were taken)
  let me=0,op=0;G.caps[-side].forEach(t=>me+=VAL[t]);G.caps[side].forEach(t=>op+=VAL[t]);return Math.round((me-op)/100);
}

/* input */
function onSquare(s){
  if(!G||G.over||G.busy||G.pos.side!==G.my)return;
  const p=G.pos,v=p.b[s];
  if(G.sel!=null){
    const cand=G.dests.filter(d=>d.t===s);
    if(cand.length){
      if(cand.length>1){askPromo(cand);return}
      play(cand[0].m);return;
    }
  }
  if(v*G.my>0){
    G.sel=s;G.dests=p.legal().filter(m=>mFrom(m)===s).map(m=>({m,t:mTo(m),ep:mFlag(m)===1}));
  }else{G.sel=null;G.dests=[]}
  render();
}
function askPromo(cand){
  const box=$('#promo');box.textContent='';box.hidden=false;
  [5,4,3,2].forEach(t=>{const m=cand.find(c=>mPromo(c.m)===t).m,b=el('button','',glyph(t));b.type='button';b.setAttribute('aria-label','Promote to '+['','','knight','bishop','rook','queen'][t]);b.style.color=G.my===1?'#fffdf8':'#1c1226';b.style.background=G.my===1?'#3a3350':'#e9e2f2';b.onclick=()=>{box.hidden=true;play(m)};box.appendChild(b)});
}

/* move execution */
function play(m){doMove(m,false)}
function doMove(m,byBot){
  const p=G.pos,f=mFrom(m),t=mTo(m),fl=mFlag(m),mover=p.side,piece=Math.abs(p.b[f]);
  const captured=fl===1?1:Math.abs(p.b[t]);
  const san=p.san(m);
  p.make(m);
  if(captured)G.caps[-mover].push(captured);
  G.hist.push({san,m,mover});G.last={f,t};G.sel=null;G.dests=[];G.anim={f,t};
  const k=p.key();G.keys[k]=(G.keys[k]||0)+1;
  try{navigator.vibrate&&navigator.vibrate(byBot?6:10)}catch(e){}
  render();
  const st=p.status(),rep=G.keys[k]>=3;
  if(st==='mate'){finish('mate',mover);return}
  if(st==='stalemate'||st==='fifty'||st==='material'||rep){finish(rep&&!st?'repeat':st);return}
  const chk=p.inCheck(p.side);
  if(!byBot){ // player moved: react, then bot thinks
    const ev=chk?'checked':captured>=3?'lost':null;
    if(ev)say(ev,0);
    G.busy=true;setTimeout(()=>botMove(ev),ev?1400:600+Math.random()*500);
  }else{
    G.busy=false;
    const swing=G.swing||0;let ev=null;
    if(chk)ev='check';else if(swing>=170)ev='blunder';else if(swing<=-170)ev='brilliant';else if(captured>=2)ev='take';
    else if(G.hist.length>6&&Math.random()<.3){const sc=G.prev||0;ev=sc>350?'winning':sc<-350?'losing':'idle'}
    else if(Math.random()<.18)ev='idle';
    if(ev)say(ev,0);
    G.swing=0;
  }
}
function botMove(spoke){
  if(!G||G.over)return;
  G.busy=true;const g=G,id=++reqId,par=botParams(g.bot,g.mood);
  const rep={};Object.keys(g.keys).forEach(k=>{if(g.keys[k]>=2)rep[k]=g.keys[k]});
  const msg={id,fen:g.pos.fen(),rep,...par};
  const started=Date.now(),minWait=500+Math.random()*600;
  const done=(r)=>{
    if(G!==g||id!==reqId||g.over)return;
    const wait=Math.max(0,minWait-(Date.now()-started));
    setTimeout(()=>{
      if(G!==g||id!==reqId||g.over)return;
      if(!r.move){g.busy=false;return}
      if(g.prev!=null&&r.depth>0)g.swing=r.score-g.prev; // bot's expectation vs. what the player actually allowed
      g.prev=r.score;
      doMove(r.move,true);
    },wait);
  };
  const w=getWorker();
  if(w){w.onmessage=(e)=>done(e.data);w.postMessage(msg)}
  else setTimeout(()=>done({...think(msg.fen,msg),id}),30);
}

/* finish */
function finish(kind,winnerSide){
  G.over=true;G.busy=false;clearTimeout(sayTimer);
  const b=G.bot;let title,why,ev,res;
  if(kind==='mate'){const me=winnerSide===G.my;title=me?'You win!':`${b.name} wins`;why='Checkmate';ev=me?'lose':'win';res=me?'w':'l'}
  else if(kind==='resign'){title=`${b.name} wins`;why='You resigned';ev='resign';res='l'}
  else{title='Draw';why={stalemate:'Stalemate',fifty:'Fifty-move rule',material:'Not enough material',repeat:'Threefold repetition'}[kind]||'Draw';ev='draw';res='d'}
  saveRec(b.id,res);
  const line=pick(b.say[ev]||b.say.idle);sayNow(line);
  setTimeout(()=>{
    if(!G||!G.over)return;
    const box=$('#rbox');box.textContent='';themeVars(box,b);
    box.append(avatar(b),el('h2','',title),el('div','why',why),el('div','say','\u201C'+line+'\u201D'),el('div','rec',`VS ${b.name.toUpperCase()}  \u00b7  ${recText(b.id)}`));
    const again=el('button','go','Rematch');again.type='button';again.onclick=()=>{$('#res').hidden=true;startGame(b,G.mood,G.my===1?'b':'w')};
    const other=el('button','cancel','Choose another opponent');other.type='button';other.onclick=leave;
    const rv=el('button','cancel','View board');rv.type='button';rv.onclick=()=>{$('#res').hidden=true};
    box.append(again,rv,other);$('#res').hidden=false;
  },kind==='resign'?400:1300);
}

renderLobby();
</script>
</body></html>
