<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI Personas – Lumora OLVRA</title>
<meta name="robots" content="noindex">
<meta name="description" content="Chat with AI personas. Share a screenshot and get their take.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
#gateScreen{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
#gateScreen .card{max-width:320px;padding:30px 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.top h1{font-size:1.4rem;margin:0}
.pill{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
h2.sec{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;font-weight:700}
.grid{display:grid;gap:10px}
@media(min-width:560px){.wrap{max-width:720px}.grid{grid-template-columns:1fr 1fr}}
.pc{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.pc:active{transform:scale(.985)}.pc:hover{border-color:var(--accent)}
.pc.locked .av{opacity:.55}.pc.locked .pd{opacity:.75}
.av{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;width:48px;height:48px;font-size:1.05rem;position:relative}
.av.sm{width:38px;height:38px;font-size:.9rem}
.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pc .av{width:64px;height:64px;font-size:1.3rem;box-shadow:0 0 0 2px var(--line)}
.pc.locked .av::after{content:"\1F512";position:absolute;right:-4px;bottom:-4px;font-size:.68rem;width:22px;height:22px;display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:50%;opacity:1}
.unl{margin-top:6px;font-size:.74rem;font-weight:700;color:var(--accent)}
.pb{flex:1;min-width:0}.pn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.pt{font-size:.8rem;color:var(--dim);font-weight:600}.pd{font-size:.88rem;margin-top:4px;line-height:1.45}
.bdg{font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.bdg.free{color:#059669;border-color:#059669}.bdg.premium{color:var(--accent);border-color:var(--accent)}
.cat{font-size:.72rem;color:var(--dim);margin-top:6px;font-weight:600}
.rc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:8px}
.rc .rb{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.rc .rt{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc .rs{font-size:.78rem;color:var(--dim)}
.ib{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:0}
.ib.del{border:0;background:none;color:var(--dim)}
/* chat */
body.inchat{padding-bottom:0;overflow:hidden;overscroll-behavior:none}
body.inchat.kb .bottom-nav,body.inchat.kb .appbar{display:none}
body.inchat.kb .ch{padding-top:calc(8px + env(safe-area-inset-top))}
body.inchat.kb .comp{padding-bottom:8px}
body.inchat.kb .use{display:none}
.hc{max-width:720px;margin:0 auto;display:flex;flex-direction:column;height:calc(100dvh - 172px - env(safe-area-inset-bottom))}
.ch{display:flex;align-items:center;gap:10px;padding:2px 16px 10px;border-bottom:1px solid var(--line)}
.ch .who{flex:1;min-width:0}.ch .nm{font-weight:800;line-height:1.2}.st{font-size:.76rem;color:var(--dim);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
.log{flex:1;min-height:60px;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.5;font-size:.95rem;overflow-wrap:anywhere;white-space:pre-wrap;animation:pop .18s ease-out}
.m.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.m.ai{align-self:flex-start;background:var(--bg-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.err{align-self:flex-start;border:1px solid #e11d48;color:#e11d48;background:var(--bg-2);border-bottom-left-radius:6px}
.m img{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-bottom:6px}
.m .rt2{display:block;margin-top:8px;font:inherit;font-weight:800;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;margin-top:2px}
.chips button{font:inherit;font-size:.85rem;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);cursor:pointer}
.chips button:active{transform:scale(.97)}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bl 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.prev{position:relative;margin:0 16px 8px;width:92px}.prev img{display:block;width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.prev button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:1rem;cursor:pointer;line-height:1}
.prev span{display:block;font-size:.7rem;color:var(--dim);margin-top:4px;font-weight:600}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.comp textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:22px !important;padding:11px 16px !important;line-height:1.4;margin:0;font-size:16px}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}.send:disabled{opacity:.4}
.use{text-align:center;font-size:.72rem;color:var(--dim);padding:0 16px 4px}
/* upgrade sheet */
#sheet{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .box{width:100%;max-width:520px;background:var(--bg);border-radius:20px 20px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));text-align:center}
#sheet .box .av{margin:0 auto 12px;width:64px;height:64px;font-size:1.4rem}
</style>
</head><body>
<div id="gateScreen" hidden><div class="glass card">
  <p style="font-weight:800;font-size:1.15rem;margin-bottom:8px">Sign in to meet the personas</p>
  <p class="sub" style="margin-bottom:20px">Create a free Lumora account. It only takes a moment.</p>
  <a class="btn pri" id="gateLink" href="/login?next=/personas">Sign in or create account</a>
</div></div>

<div id="gatedApp" hidden>
  <div class="wrap" id="picker">
    <div class="top"><h1>AI Personas</h1><span class="pill" id="usagePill" hidden></span></div>
    <p class="sub" style="margin:0">Pick a personality to talk to. Share a screenshot and get their take.</p>
    <div id="recentWrap" hidden><h2 class="sec">Recent chats</h2><div id="recent"></div></div>
    <h2 class="sec">Free</h2><div class="grid" id="gFree"></div>
    <h2 class="sec">Premium</h2><div class="grid" id="gPrem"></div>
    <p class="sub" id="pickErr" style="color:#e11d48;margin-top:14px" hidden></p>
  </div>

  <div class="hc" id="chat" hidden>
    <div class="ch">
      <button class="ib" id="back" type="button" aria-label="Back to personas"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="av sm" id="cav"></div>
      <div class="who"><div class="nm" id="cname"></div><div class="st"><span class="dot"></span>AI persona &middot; online</div></div>
      <button class="ib" id="newchat" type="button" aria-label="New conversation"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <div class="prev" id="prev" hidden><img id="pimg" alt="Attached screenshot"><button type="button" id="prm" aria-label="Remove image">&times;</button><span>Image attached</span></div>
    <div class="use" id="use"></div>
    <form class="comp" id="comp" autocomplete="off">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/*" hidden>
      <button class="ib" id="attach" type="button" aria-label="Attach an image" style="width:44px;height:44px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </div>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="box">
  <div class="av" id="sav"></div>
  <h3 id="stitle" style="margin-bottom:6px"></h3>
  <p class="sub" id="stext" style="margin:0 0 18px"></p>
  <a class="btn pri" href="/account" style="display:block;margin-bottom:10px">See Premium</a>
  <button class="btn" type="button" id="sclose" style="width:100%">Not now</button>
</div></div>

<script type="module">
import {requireAuth} from '/gate.js';
import {mountNav} from '/nav.js';
import {auth,db} from '/firebase-init.js';
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,query,orderBy,limit,getDocs,getDoc,doc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
mountNav();requireAuth();

const $=s=>document.querySelector(s), el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const S={use:{},tier:'free',personas:[],limits:null,usage:null,persona:null,convId:null,busy:false,img:null,last:null,uid:null};
const log=$('#log'),inp=$('#inp'),sendBtn=$('#send');
/* ---- keep chat inside the visible area: above the on-screen keyboard; bottom nav only shown while the keyboard is closed ---- */
const vv=window.visualViewport,chatEl=$('#chat');let baseH=0;
function fit(){
  const st=chatEl.style;
  if(!S.persona){st.cssText='';document.body.classList.remove('kb');return}
  const h=vv?vv.height:innerHeight,off=vv?vv.offsetTop:0;
  if(document.activeElement!==inp||h>baseH)baseH=Math.max(baseH,h,innerHeight);
  const kb=baseH-h>120;
  document.body.classList.toggle('kb',kb);
  if(kb){
    // Pin the chat to exactly the visible area above the keyboard, whichever way the browser handles the keyboard
    // (resizes the page, or only the visual viewport and scrolls it).
    st.cssText=`position:fixed;left:0;right:0;top:${off}px;height:${Math.floor(h)}px;z-index:60;background:var(--bg);box-sizing:border-box`;
    log.scrollTop=log.scrollHeight;return;
  }
  st.cssText='';
  if(window.scrollY)window.scrollTo(0,0);
  const nav=document.querySelector('.bottom-nav'),navH=nav?nav.getBoundingClientRect().height:0;
  const top=chatEl.getBoundingClientRect().top;
  st.height=Math.max(220,Math.floor(h-top-navH))+'px';
}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
addEventListener('resize',fit);addEventListener('orientationchange',()=>{baseH=0;setTimeout(fit,300)});
inp.addEventListener('focus',()=>{setTimeout(fit,120);setTimeout(fit,450)});
inp.addEventListener('blur',()=>setTimeout(fit,150));
const LOCK='<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';

async function api(body){
  const u=auth.currentUser; if(!u) return {status:401,data:{error:'Sign in first.'}};
  try{
    const r=await fetch('/.netlify/functions/persona-chat',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+await u.getIdToken()},body:JSON.stringify(body)});
    const data=await r.json().catch(()=>({}));
    if(r.status===401) location.href='/login?next=/personas';
    return {status:r.status,data};
  }catch(e){return {status:0,data:{error:'No connection. Check your internet and try again.'}}}
}
const SAFE_IMG=/^\/\.netlify\/functions\/persona-image\?id=[a-z-]+&v=\d+$/; // portraits only ever come from our own image endpoint
function avatar(p,cls){
  const a=el('div','av'+(cls?' '+cls:''));a.style.background=`linear-gradient(135deg,${p.avatar.from},${p.avatar.to})`;
  const initial=()=>{a.textContent=p.name.replace(/^The /,'')[0]};
  if(p.image&&SAFE_IMG.test(p.image)){
    const i=el('img');i.src=p.image;i.alt=`Portrait of ${p.name}, ${p.title}`;i.loading='lazy';i.decoding='async';i.width=i.height=128;
    i.onerror=()=>{i.remove();initial()};a.appendChild(i);
  }else initial();
  return a;
}
function badge(p){const b=el('span','bdg '+p.accessLevel);b.innerHTML=(p.locked?LOCK:'')+p.badge;return b}

function card(p){
  const b=el('button','pc'+(p.locked?' locked':''));b.type='button';
  const body=el('div','pb'),n=el('div','pn',p.name);n.appendChild(badge(p));
  body.append(n,el('div','pt',p.title),el('div','pd',p.description),el('div','cat',p.category+' \u00b7 '+p.traits.slice(0,3).join(', ')));
  if(p.locked)body.appendChild(el('div','unl','Tap to unlock with Premium'));
  b.append(avatar(p),body);b.onclick=()=>p.locked?upsell(p):openChat(p);return b;
}
function renderPicker(){
  const f=$('#gFree'),m=$('#gPrem');f.textContent='';m.textContent='';
  const by=(a,b)=>(S.use[b.id]||0)-(S.use[a.id]||0); // most used first, ties keep default order
  S.personas.filter(p=>p.accessLevel==='free').sort(by).forEach(p=>f.appendChild(card(p)));
  S.personas.filter(p=>p.accessLevel!=='free').sort(by).forEach(p=>m.appendChild(card(p)));
  usage();
}
function usage(){
  if(!S.usage||!S.limits)return;
  const left=Math.max(0,S.limits.dailyMessages-S.usage.messages),il=Math.max(0,S.limits.dailyImages-S.usage.images);
  const t=`${left} message${left===1?'':'s'} left today`;
  const p=$('#usagePill');p.hidden=false;p.textContent=t;
  $('#use').textContent=`${t} \u00b7 ${il} image${il===1?'':'s'} left`;
}
function upsell(p){
  const a=$('#sav');a.replaceWith(Object.assign(avatar(p),{id:'sav'}));
  $('#stitle').textContent=`${p.name} is a ${p.badge} persona`;
  $('#stext').textContent=`Upgrade to Premium to chat with ${p.name} and all other Premium personas.`;
  $('#sheet').hidden=false;
}
$('#sclose').onclick=()=>{$('#sheet').hidden=true;if(fromChat&&!S.persona)location.href='/chat'};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.target.hidden=true};

/* ---- history (reads go straight to Firestore under owner-only rules; writes only via the function) ---- */
async function loadRecent(){
  const w=$('#recentWrap'),box=$('#recent');
  try{
    const s=await getDocs(query(collection(db,'users',S.uid,'conversations'),orderBy('updatedAt','desc'),limit(15)));
    box.textContent='';w.hidden=!s.docs.length;
    s.docs.forEach(d=>{
      const c=d.data(),p=S.personas.find(x=>x.id===c.personaId);if(!p)return;
      const r=el('div','rc'),b=el('button','rb');b.type='button';
      b.append(el('div','rt',c.title||'Conversation'),el('div','rs',p.name+' \u00b7 '+ago(c.updatedAt)));
      b.onclick=()=>p.locked?upsell(p):openChat(p,d.id);
      const x=el('button','ib del');x.type='button';x.setAttribute('aria-label','Delete conversation');
      x.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
      x.onclick=()=>delConv(d.id,r);
      r.append(avatar(p,'sm'),b,x);box.appendChild(r);
    });
  }catch(e){w.hidden=true}
}
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
async function delConv(id,row){
  if(!confirm('Delete this conversation? This can\u2019t be undone.'))return;
  const r=await api({action:'delete',conversationId:id});
  if(r.status===200){row.remove();if(!$('#recent').children.length)$('#recentWrap').hidden=true;if(S.convId===id)goPicker()}
  else{const e=$('#pickErr');e.hidden=false;e.textContent=r.data.error||'Couldn\u2019t delete that conversation.'}
}

/* ---- chat ---- */
function bubble(role,text,img){
  const m=el('div','m '+(role==='user'?'me':'ai'));
  if(img){const i=el('img');i.src=img;i.alt='Attached image';m.appendChild(i)}
  if(text)m.appendChild(document.createTextNode(text));
  log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
}
function greet(){
  const g=S.persona.greetings;bubble('model',g[Math.floor(Math.random()*g.length)]);
  const st=S.persona.starters||[];
  if(st.length){const c=el('div','chips');st.forEach(x=>{const b=el('button','',x.label);b.type='button';b.onclick=()=>{if(S.busy)return;S.convId=null;S.last={text:x.text,image:null,mode:x.mode};deliver()};c.appendChild(b)});log.appendChild(c)}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Show a multi-part reply like a person texting: one bubble, a short typing pause, the next bubble.
async function reveal(parts){
  const tok=S.rev=(S.rev||0)+1,p0=S.persona;
  for(let i=0;i<parts.length;i++){
    if(S.rev!==tok||S.persona!==p0)break;
    if(i>0){const t=el('div','typing');t.innerHTML='<i></i><i></i><i></i>';log.appendChild(t);log.scrollTop=log.scrollHeight;
      await sleep(Math.min(1500,420+parts[i].length*14));t.remove();if(S.rev!==tok||S.persona!==p0)break}
    bubble('model',parts[i]);
  }
  if(S.rev===tok)S.busy=false;grow();
}
async function openChat(p,convId){
  S.rev=(S.rev||0)+1;S.busy=false;
  S.persona=p;S.convId=convId||null;S.last=null;setImg(null);
  $('#picker').hidden=true;$('#chat').hidden=false;document.body.classList.add('inchat');window.scrollTo(0,0);fit();
  $('#cav').replaceWith(Object.assign(avatar(p,'sm'),{id:'cav'}));
  $('#cname').textContent=p.name;log.textContent='';inp.value='';grow();usage();
  if(!convId){greet();inp.focus();return}
  try{
    const s=await getDocs(query(collection(db,'users',S.uid,'conversations',convId,'messages'),orderBy('createdAt','asc'),limit(200)));
    s.docs.forEach(d=>{const m=d.data();bubble(m.role,m.text||(m.hasImage?'':''),null);if(m.hasImage&&m.role==='user'){const l=log.lastChild;const t=el('div','');t.style.cssText='font-size:.75rem;opacity:.85;margin-bottom:4px';t.textContent='[Image]';l.insertBefore(t,l.firstChild)}});
  }catch(e){bubble('model','Couldn\u2019t load this conversation.');log.lastChild.className='m err'}
}
function goPicker(){
  S.rev=(S.rev||0)+1;S.busy=false;
  $('#chat').hidden=true;$('#picker').hidden=false;document.body.classList.remove('inchat');S.persona=null;S.convId=null;fit();
  loadRecent();usage();
}
let fromChat=false; // opened from the Chat page: Back returns there
$('#back').onclick=()=>fromChat?(location.href='/chat'):goPicker();
$('#newchat').onclick=()=>{if(S.busy)return;S.rev=(S.rev||0)+1;S.convId=null;S.last=null;log.textContent='';setImg(null);greet();inp.focus()};

function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';sendBtn.disabled=S.busy||!(inp.value.trim()||S.img)}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('#comp').requestSubmit()}});

/* ---- image: resized/compressed in the browser, sent once inside the request, never stored publicly ---- */
function setImg(v){S.img=v;$('#prev').hidden=!v;if(v)$('#pimg').src=v;$('#file').value='';grow()}
function shrink(file){return new Promise((ok,no)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
    const tries=[[1280,.82],[1024,.72],[800,.65]];let out='';
    for(const[mx,q]of tries){const r=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<1800000)break}
    URL.revokeObjectURL(u);out.length<1800000?ok(out):no(new Error('That image is too large. Try a smaller screenshot.'))};
  img.onerror=()=>no(new Error('That image could not be read.'));img.src=u})}
$('#attach').onclick=()=>{if(!S.busy)$('#file').click()};
$('#prm').onclick=()=>setImg(null);
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{if(f.size>25e6)throw new Error('That image is too large.');if(!/^image\//.test(f.type))throw new Error('Please choose an image.');setImg(await shrink(f));inp.focus()}
  catch(x){bubble('model',x.message);log.lastChild.className='m err'}};

/* ---- send ---- */
$('#comp').onsubmit=e=>{e.preventDefault();if(S.busy)return;const t=inp.value.trim();if(!t&&!S.img)return;
  S.last={text:t,image:S.img};inp.value='';setImg(null);grow();deliver()};
async function deliver(){
  const {text,image,mode}=S.last;S.busy=true;grow();
  log.querySelectorAll('.m.err,.chips').forEach(n=>n.remove());
  if(!S.last.shown){bubble('user',text||(mode==='mystery'?'Start a mystery':''),image);S.last.shown=true}
  const ty=el('div','typing');ty.innerHTML='<i></i><i></i><i></i>';log.appendChild(ty);log.scrollTop=log.scrollHeight;
  const r=await api({action:'send',personaId:S.persona.id,conversationId:S.convId,message:text,mode:mode||undefined,image:image||undefined});
  ty.remove();if(r.status!==200)S.busy=false;
  if(r.status===200){
    S.convId=r.data.conversationId;S.last=null;
    S.usage={messages:r.data.usage.messages,images:r.data.usage.images};S.limits={...S.limits,dailyMessages:r.data.usage.dailyMessages,dailyImages:r.data.usage.dailyImages};usage();
    await reveal(r.data.replies&&r.data.replies.length?r.data.replies:[r.data.reply]);
  }else{
    const c=r.data.code,m=bubble('model',r.data.error||'Something went wrong. Please try again.');m.className='m err';
    if(c==='PREMIUM_REQUIRED'){S.last=null;upsell(S.persona)}
    else if(r.status===429&&(c==='DAILY_LIMIT'||c==='IMAGE_LIMIT')){S.last=null}
    else if(S.last){const b=el('button','rt2','Try again');b.type='button';b.onclick=()=>deliver();m.appendChild(b)}
  }
  grow();
}

async function loadUse(){
  try{const s=await getDocs(query(collection(db,'users',S.uid,'conversations'),orderBy('updatedAt','desc'),limit(100)));
    S.use={};s.docs.forEach(d=>{const c=d.data();S.use[c.personaId]=(S.use[c.personaId]||0)+(c.messageCount||0)})}catch(e){S.use={}}
}

/* ---- boot ---- */
onAuthStateChanged(auth,async u=>{
  if(!u)return;S.uid=u.uid;
  const r=await api({action:'list'});
  if(r.status!==200){const e=$('#pickErr');e.hidden=false;e.textContent=r.status===403?r.data.error:'Couldn\u2019t load the personas. Please try again.';return}
  Object.assign(S,{tier:r.data.tier,personas:r.data.personas,limits:r.data.limits,usage:r.data.usage});
  await loadUse();renderPicker();loadRecent();
  const m=/^#([cp])=(.+)$/.exec(location.hash);
  if(m){
    const id=decodeURIComponent(m[2]);history.replaceState(null,'',location.pathname);fromChat=true;
    try{
      let p;
      if(m[1]==='p')p=S.personas.find(x=>x.id===id);
      else{const c=await getDoc(doc(db,'users',S.uid,'conversations',id));p=c.exists()&&S.personas.find(x=>x.id===c.data().personaId)}
      if(p){p.locked?upsell(p):openChat(p,m[1]==='c'?id:undefined)}
    }catch(e){}
  }
});
</script>
</body></html>
