<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Me – Lumora OLVRA</title>
<meta name="robots" content="noindex">
<meta name="description" content="Your Lumora OLVRA account, plan and notifications.">
<link rel="canonical" href="https://lumoral.netlify.app/account"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/love.css">
<link rel="stylesheet" href="/nav.css">
<script src="https://checkout.flutterwave.com/v3.js"></script>
<style>
#avatarWrap{display:flex;align-items:center;gap:16px;margin:6px 0 22px}
#avatarImg{width:72px;height:72px;border-radius:50%;object-fit:cover}
#avatarPlaceholder{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:26px}
#avatarFile{display:none}
.plancard{padding:20px;border-radius:22px;margin:4px 0 18px}
.plancard .kicker{font-size:.76rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.plancard .big{font-family:var(--serif);font-size:1.5rem;margin:2px 0 4px}
.plancard.on{background:linear-gradient(135deg,rgba(214,31,105,.16),rgba(255,122,89,.14)) !important}
.compare{width:100%;border-collapse:collapse;margin:14px 0 4px;font-size:.88rem}
.compare th,.compare td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.compare td:first-child,.compare th:first-child{text-align:left}
.compare th{font-weight:800}
.notif{padding:12px 14px;border-radius:14px;margin-bottom:8px}
.notif.unread{border-left:4px solid var(--rose)}
.notif b{display:block;font-size:.88rem}.notif span{color:var(--dim);font-size:.82rem}
</style>
<link rel="stylesheet" href="/app.css">
<script>try{var t=localStorage.getItem('lumora_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script></head><body><div class="wrap">
<h1>Me</h1>
<div id="avatarWrap">
  <img id="avatarImg" src="" alt="" hidden><div id="avatarPlaceholder" class="glass" style="color:var(--dim)"><svg viewBox="0 0 24 24" width="32px" height="32px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg></div>
  <div><button class="btn" id="avatarBtn" type="button">Change photo</button><input id="avatarFile" type="file" accept="image/*"><p class="sub" id="avatarMsg" style="margin-top:6px"></p></div>
</div>

<label for="nameIn">Full name</label>
<input id="nameIn" type="text" placeholder="Your name" autocomplete="name">
<label for="phoneIn">Phone number</label>
<input id="phoneIn" type="tel" placeholder="e.g. 08012345678" autocomplete="tel">
<p class="sub" id="nameMsg" style="margin:4px 0 18px"></p>

<div class="glass plancard" id="planCard">
  <div class="kicker" id="planKicker">Loading...</div>
  <div class="big" id="planBig">–</div>
  <p class="sub" id="planSub"></p>
</div>

<table class="compare">
  <tr><th>Feature</th><th>Free</th><th>Premium</th></tr>
  <tr><td>Love messages</td><td id="cmpFree">–</td><td>Unlimited</td></tr>
  <tr><td>Business card watermark</td><td>Shown</td><td>Removed</td></tr>
  <tr><td>Chat with friends</td><td><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></td><td><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></td></tr>
</table>

<div id="upgrade">
  <label for="country">Your country</label><select id="country"></select>
  <p id="price"></p><p class="sub">for 30 days. Paying again adds 30 more days.</p>
  <div class="acts"><button class="btn pri" id="pay">Pay for Premium</button></div>
</div>
<button class="txt" id="signout">Sign out</button>
<p id="err" role="alert"></p>

<div id="notifSection">
  <h2 style="font-size:1.1rem;margin:26px 0 8px">Push notifications</h2>
  <div class="row" style="margin-bottom:8px">
    <span class="sub" id="pushLabel" style="margin:0">Get notified on this device</span>
    <label style="display:inline-flex;align-items:center;cursor:pointer">
      <input type="checkbox" id="pushToggle" style="width:44px;height:26px;accent-color:var(--accent)">
    </label>
  </div>
  <a class="btn" href="/notifications" style="display:block;margin-top:18px;text-align:center">View all notifications</a>
</div>

<p style="margin-top:30px"><a href="/terms" style="color:var(--accent)">Terms &amp; Conditions</a> · <a href="/help" style="color:var(--accent)">Help</a></p>
</div>
<script type="module">
import {auth,db} from '/firebase-init.js';
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,setDoc,collection,query,orderBy,limit,onSnapshot,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {mountNav} from '/nav.js';
import {LIST,flag,detectCountry} from '/countries.js';
mountNav({showLogo:false});
const FLW_PUBLIC_KEY='FLWPUBK-dae6911df14de57441cd3735cfb06bc2-X'; // Flutterwave public key (FLWPUBK-...). Safe to be public.
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const err=m=>$('#err').textContent=m||'';
const [P,PR]=await Promise.all([fetch('/pricing.json').then(r=>r.json()),fetch('/pricing.json').then(r=>r.json())]);
const fmt=p=>new Intl.NumberFormat('en',{style:'currency',currency:p.currency,minimumFractionDigits:0,maximumFractionDigits:2}).format(p.amount);
$('#cmpFree').textContent=(P.freeLoveLimit||3)+' total';
$('#country').innerHTML=LIST.filter(c=>P.countries[c.code]).map(c=>`<option value="${c.code}">${flag(c.code)} ${c.name}</option>`).join('')+'<option value="OTHER">🌍 Other</option>';
(async()=>{const c=await detectCountry();$('#country').value=P.countries[c]?c:'OTHER';showPrice()})();
const showPrice=()=>$('#price').textContent=fmt(P.countries[$('#country').value]||P.countries.OTHER);
$('#country').onchange=showPrice;

async function refresh(u){
  let data={};
  try{const s=await getDoc(doc(db,'users',u.uid));data=s.exists()?s.data():{}}catch(e){}
  const until=data.premiumUntil?data.premiumUntil.toDate():null,active=until&&until>new Date();
  const trial=active&&data.trialEndsAt&&until.getTime()<=data.trialEndsAt.toDate().getTime()+1000;
  const days=active?Math.max(1,Math.ceil((until-Date.now())/86400000)):0;
  $('#planCard').classList.toggle('on',active);
  $('#planKicker').textContent=active?(trial?'Free trial':'Premium'):'Free plan';
  $('#planBig').textContent=active?days+(days===1?' day left':' days left'):'No active plan';
  $('#planSub').textContent=active
    ?('Active until '+until.toLocaleDateString()+(trial?'. Enjoy full Premium while your trial lasts.':'.'))
    :(data.trialEndsAt?'Your free trial has ended. Upgrade any time to unlock everything again.':'Upgrade to unlock unlimited love messages and remove the watermark.');
  $('#upgrade').hidden=false;
  $('#pay').textContent=active&&!trial?'Add 30 more days':'Pay for Premium';
  const photo=data.photoURL||u.photoURL;
  if(photo){$('#avatarImg').src=photo;$('#avatarImg').hidden=false;$('#avatarPlaceholder').hidden=true}
  $('#nameIn').value=data.displayName||u.displayName||'';
  $('#phoneIn').value=data.phone||'';
}

// ---- Name + phone: name is user-writable directly (Firestore rules allow
// displayName), phone goes through ensure-user since rules don't allow it
// as a direct client write. ----
function wireProfileFields(u){
  $('#nameIn').onchange=async()=>{
    const name=$('#nameIn').value.trim();
    if(!name)return;
    try{
      await setDoc(doc(db,'users',u.uid),{displayName:name},{merge:true});
      const {updateProfile}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
      await updateProfile(u,{displayName:name});
      $('#nameMsg').textContent='Saved.';
    }catch(e){$('#nameMsg').textContent='Could not save. Try again.'}
  };
  $('#phoneIn').onchange=async()=>{
    const phone=$('#phoneIn').value.trim();
    if(!phone)return;
    try{
      await fetch('/.netlify/functions/ensure-user',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+await u.getIdToken()},body:JSON.stringify({phone,changePhone:true})});
      $('#nameMsg').textContent='Saved.';
    }catch(e){$('#nameMsg').textContent='Could not save. Try again.'}
  };
}

// ---- Profile photo ----
// Base64, resized client-side: no Storage bucket needed, just a small square JPEG saved on the user doc.
$('#avatarBtn').onclick=()=>$('#avatarFile').click();
$('#avatarFile').onchange=()=>{
  const u=auth.currentUser,file=$('#avatarFile').files[0];$('#avatarFile').value='';
  if(!u||!file)return;
  if(!file.type.startsWith('image/')){$('#avatarMsg').textContent='Choose an image file.';return}
  if(file.size>8*1024*1024){$('#avatarMsg').textContent='Image must be under 8MB.';return}
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async()=>{
      const SIZE=200;
      const canvas=document.createElement('canvas');canvas.width=SIZE;canvas.height=SIZE;
      const ctx=canvas.getContext('2d');
      const side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
      ctx.drawImage(img,sx,sy,side,side,0,0,SIZE,SIZE);
      const dataUrl=canvas.toDataURL('image/jpeg',0.82);
      $('#avatarMsg').textContent='Updating photo...';
      try{
        await setDoc(doc(db,'users',u.uid),{photoURL:dataUrl},{merge:true});
        $('#avatarImg').src=dataUrl;$('#avatarImg').hidden=false;$('#avatarPlaceholder').hidden=true;
        $('#avatarMsg').textContent='Photo updated.';
      }catch(e){$('#avatarMsg').textContent='Could not update the photo. Try again.'}
    };
    img.onerror=()=>$('#avatarMsg').textContent='Could not read that image. Try another.';
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};

// ---- Notifications ----
function watchNotifications(u){
  const q=query(collection(db,'users',u.uid,'notifications'),orderBy('createdAt','desc'),limit(30));
  onSnapshot(q,snap=>{
    $('#notifSection').hidden=snap.empty;
    if(snap.empty)return;
    $('#notifList').innerHTML=snap.docs.map(d=>{
      const n=d.data();
      const when=n.createdAt&&n.createdAt.toDate?n.createdAt.toDate().toLocaleDateString():'';
      return `<div class="glass notif ${n.read?'':'unread'}" data-id="${d.id}"><b>${n.title||''}</b><span>${n.body||''} · ${when}</span></div>`;
    }).join('');
    $$('.notif').forEach(el=>el.onclick=()=>updateDoc(doc(db,'users',u.uid,'notifications',el.dataset.id),{read:true}).catch(()=>{}));
  },()=>{});
}

// ---- Push notifications (Web Push / VAPID) ----
let _vapidCache=null;
async function getVapidKey(){
  if(_vapidCache)return _vapidCache;
  const r=await fetch('/.netlify/functions/get-vapid-key');
  if(!r.ok)throw new Error('Push is not set up yet.');
  _vapidCache=(await r.json()).publicKey;return _vapidCache;
}
function b64ToArr(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function savePushSubscription(sub){
  const u=auth.currentUser;if(!u)return;
  await setDoc(doc(db,'users',u.uid),{pushSubscription:sub.toJSON()},{merge:true});
}
async function subscribeToPush(reg,forceNew=false){
  let existing=await reg.pushManager.getSubscription();
  if(existing&&forceNew){await existing.unsubscribe();existing=null}
  if(existing){await savePushSubscription(existing);return existing}
  const perm=await Notification.requestPermission();
  if(perm!=='granted')return null;
  const key=await getVapidKey();
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToArr(key)});
  await savePushSubscription(sub);return sub;
}
async function initPushToggle(){
  const t=$('#pushToggle');if(!t)return;
  if(!('Notification' in window)||!('serviceWorker' in navigator)){t.disabled=true;$('#pushLabel').textContent='Not supported on this browser';return}
  const reg=await navigator.serviceWorker.ready.catch(()=>null);if(!reg)return;
  const sub=await reg.pushManager.getSubscription();
  const on=sub!==null&&Notification.permission==='granted';
  t.checked=on;$('#pushLabel').textContent=on?'Notifications are on':'Get notified on this device';
}
$('#pushToggle')?.addEventListener('change',async()=>{
  const t=$('#pushToggle');
  if(t.checked){
    $('#pushLabel').textContent='Enabling...';
    const reg=await navigator.serviceWorker.ready.catch(()=>null);
    const sub=reg&&await subscribeToPush(reg,true).catch(()=>null);
    if(sub){$('#pushLabel').textContent='Notifications are on'}
    else{t.checked=false;$('#pushLabel').textContent=Notification.permission==='denied'?'Blocked — enable in browser settings':'Could not enable — try again'}
  }else{
    const reg=await navigator.serviceWorker.ready.catch(()=>null);
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub)await sub.unsubscribe();
    const u=auth.currentUser;if(u){try{await setDoc(doc(db,'users',u.uid),{pushSubscription:null},{merge:true})}catch(e){}}
    $('#pushLabel').textContent='Get notified on this device';
  }
});

async function verifyPayment(u,transactionId,txRef,country){
  $('#planBig').textContent='Verifying your payment...';
  try{
    const res=await fetch('/.netlify/functions/verify-premium',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+await u.getIdToken()},body:JSON.stringify({transactionId,txRef,country})});
    const d=await res.json();
    if(!res.ok)throw new Error(d.error);
  }catch(e){err(e.message||'Could not verify the payment. If you were charged, contact support.')}
  refresh(u);wireProfileFields(u);
}
onAuthStateChanged(auth,async u=>{
  if(!u){location.replace('/login?next=/account');return}
  await refresh(u);wireProfileFields(u);initPushToggle();
  // Some payment methods (bank transfer, USSD) leave the inline checkout and
  // come back via redirect instead of firing the in-page callback. Flutterwave
  // appends these params to redirect_url, so pick up the payment here too.
  const qs=new URLSearchParams(location.search);
  if(qs.get('status')==='successful'&&qs.get('transaction_id')&&qs.get('tx_ref')){
    const country=sessionStorage.getItem('lumora_pay_country')||'NG';
    history.replaceState({},'',location.pathname);
    await verifyPayment(u,qs.get('transaction_id'),qs.get('tx_ref'),country);
  }else if(qs.has('status')){
    history.replaceState({},'',location.pathname);
    if(qs.get('status')!=='successful')err('Payment was not completed.');
  }
});
$('#pay').onclick=()=>{
  err();const u=auth.currentUser,c=$('#country').value,p=P.countries[c]||P.countries.OTHER;
  if(FLW_PUBLIC_KEY.startsWith('PASTE')){err('Payments are not switched on yet.');return}
  const txRef='OQ-'+u.uid.slice(0,8)+'-'+Date.now();
  sessionStorage.setItem('lumora_pay_country',c);
  FlutterwaveCheckout({
    public_key:FLW_PUBLIC_KEY,tx_ref:txRef,amount:p.amount,currency:p.currency,
    redirect_url:location.origin+'/account',
    payment_options:c==='NG'?'card, banktransfer, ussd':undefined,
    customer:{email:u.email,name:u.displayName||u.email},
    customizations:{title:'Lumora Premium',description:P.days+' days'},
    callback:async r=>{await verifyPayment(u,r.transaction_id,txRef,c)},
    onclose(){}
  });
};
$('#signout').onclick=()=>signOut(auth);
</script></body></html>
